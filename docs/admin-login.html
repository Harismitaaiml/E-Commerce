<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HobbyHub | Admin Login</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body class="login-body">

<div class="login-card">
    <div class="logo">H<span>H</span></div>

    <h1>HobbyHub</h1>
    <p class="muted">Administrator Portal</p>

    <form id="loginForm">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Admin email" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit" id="loginBtn">Login to Dashboard</button>
        <p id="loginMessage"></p>
    </form>

    <a href="/" class="back-link">← Back to Store</a>
</div>

<script type="module" src="/admin-login.js"></script>
</body>
</html>
